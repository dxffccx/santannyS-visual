name: Build santannyS visual
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew build --no-daemon; else gradle build --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: santannys-visual-jar
          path: build/libs/*.jar
